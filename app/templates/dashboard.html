<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JM 私人下载站</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span>JM</span> 私人下载站</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="ghost" type="submit">退出</button>
    </form>
  </header>
  <main class="page">
    <section class="hero-card">
      <p class="eyebrow">新建下载</p>
      <h1>输入漫画 ID</h1>
      <p class="muted">可以输入纯数字或 JM 开头的编号。任务完成后即可下载 ZIP。</p>
      <form method="post" action="/tasks" class="download-form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <div class="id-input"><span>JM</span><input name="album_id" inputmode="numeric" pattern="(?:JM)?[0-9]+" placeholder="123456" required autofocus></div>
        <button type="submit">开始下载</button>
      </form>
    </section>

    <section class="tasks-section">
      <div class="section-title"><h2>下载任务</h2><span id="refresh-state" class="muted">自动刷新</span></div>
      <div id="task-list" class="task-list" data-csrf="{{ csrf }}">
        {% for task in tasks %}
        <article class="task-card">
          <div><strong>JM{{ task.album_id }}</strong><p>{{ task.message or task.status }}</p></div>
          <span class="status status-{{ task.status }}">{{ task.status }}</span>
        </article>
        {% else %}
        <div class="empty">还没有任务</div>
        {% endfor %}
      </div>
    </section>
  </main>
</body>
</html>
